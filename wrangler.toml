name            = "yennefer"
main            = "workers/index.js"
compatibility_date  = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Build step ───────────────────────────────────────────────────────────────
# Runs before every `wrangler deploy` (including Cloudflare's native CI).
# NODE_OPTIONS flag works around the OpenSSL compatibility issue in
# react-scripts 5.x on Node 18+.
[build]
command = "cd frontend && npm install && NODE_OPTIONS=--openssl-legacy-provider npm run build"

# ─── Static Assets (React SPA build output) ──────────────────────────────────
# The ASSETS binding serves the React bundle with proper cache headers and
# falls back to index.html for client-side routing.
[assets]
directory = "frontend/build"
binding   = "ASSETS"

# ─── Placement ───────────────────────────────────────────────────────────────
[placement]
mode = "smart"

# ─── Production environment (yennefer.quest) ─────────────────────────────────
# BACKEND_URL is set as a Cloudflare Worker secret (not a plain var) so it
# stays encrypted and is never committed to source:
#   echo "<cloud-run-url>" | npx wrangler secret put BACKEND_URL --env production
[env.production]
routes = [
  { pattern = "yennefer.quest/*", zone_name = "yennefer.quest" },
]

# ─── Preview / staging environment ───────────────────────────────────────────
[env.staging]
routes = [
  { pattern = "staging.yennefer.quest/*", zone_name = "yennefer.quest" },
]

[env.staging.vars]
BACKEND_URL = "http://localhost:8080"
