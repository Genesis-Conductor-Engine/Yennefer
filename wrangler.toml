name            = "yennefer"
main            = "workers/index.js"
compatibility_date  = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Static Assets (React SPA build output) ──────────────────────────────────
# After `npm run build` in frontend/, the dist goes to frontend/build.
# The ASSETS binding lets the worker serve files with proper cache headers and
# fall back to index.html for client-side routing.
[assets]
directory = "frontend/build"
binding   = "ASSETS"

# ─── Placement ───────────────────────────────────────────────────────────────
[placement]
mode = "smart"

# ─── Production environment (yennefer.quest) ─────────────────────────────────
[env.production]
routes = [
  { pattern = "yennefer.quest/*", zone_name = "yennefer.quest" },
]

[env.production.vars]
# Cloud Run service URL for the Go Soul Lattice backend.
# Override with `wrangler secret put BACKEND_URL` to keep it out of source.
BACKEND_URL = "https://soul-lattice-<hash>-uc.a.run.app"

# ─── Preview / staging environment ───────────────────────────────────────────
[env.staging]
routes = [
  { pattern = "staging.yennefer.quest/*", zone_name = "yennefer.quest" },
]

[env.staging.vars]
BACKEND_URL = "http://localhost:8080"
